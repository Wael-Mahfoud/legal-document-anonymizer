services:
  anonymizer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: text-obfuscation-app

    ports:
      - "8501:8501"

    environment:
      HF_HOME: /root/.cache/huggingface
      PYTHONPATH: /workspace

    volumes:
      - hf_cache:/root/.cache/huggingface

    restart: unless-stopped

volumes:
  hf_cache: